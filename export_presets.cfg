; Export presets for the Windows desktop target.
;
; Created by hand rather than by the editor's export dialog on purpose: no
; local paths are written here, so the file is safe to commit and works in CI.
; The editor rewrites this file with its own defaults the first time the export
; dialog is opened - that is fine, nothing in it is secret.
;
; To build:  godot --path . --headless --export-debug "Windows Desktop"
; Check the presets Godot knows about:
;            godot --path . --headless --list-export-presets

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
export_files=PackedStringArray("res://")
include_filter=""
exclude_filter="test-output/*, tools/*, docs/*, screenshots/*, .github/*, tests/*, assets/source/*, promo/*"
export_path="build/echo_of_void.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc=true
texture_format/etc2=false
texture_format/bptc=true
binary_format/architecture="x86_64"
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.9.0"
application/product_version="0.9.0"
application/company_name=""
application/product_name="Echo of Void"
application/file_description="A 2D top-down space horror survey"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false
